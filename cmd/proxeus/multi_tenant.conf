## Example: multi-tenant downstreams (Mimir / Cortex / GEM)
##
## A server_group is a set of endpoints that hold the *same* data; proxeus
## merges/deduplicates within a group. With multi-tenant backends the dataset
## is identified by (host, X-Scope-OrgID), not host alone -- so each
## (backend, tenant) pair needs its own server_group, plus a static label
## (`dc` here) to keep label-less results like `count(up)` distinguishable
## across groups. See https://github.com/jacksontj/promxy/issues/703.
##
## Topology below: `dc1/2/3` each live on one backend; `google-us-dc1/2` are
## replicated across mimir.dc1 + mimir.dc2; `google-eu-dc1/2` live only on
## mimir.dc3.
##
## That is the shape for a fixed set of tenants proxeus queries on everyone's
## behalf. When the tenant is the *caller's* instead, see the commented block at
## the end of this file: one server_group, tenant derived per request.

proxeus:
  server_groups:
    - http_headers:
        X-Scope-OrgID: dc1
      path_prefix: /prometheus
      scheme: https
      static_configs:
        - targets:
            - mimir.dc1.local:8080
      labels:
        dc: dc1

    - http_headers:
        X-Scope-OrgID: dc2
      path_prefix: /prometheus
      scheme: https
      static_configs:
        - targets:
            - mimir.dc2.local:8080
      labels:
        dc: dc2

    - http_headers:
        X-Scope-OrgID: dc3
      path_prefix: /prometheus
      scheme: https
      static_configs:
        - targets:
            - mimir.dc3.local:8080
      labels:
        dc: dc3

    # Replicated tenants: both backends carry the same data, so they belong
    # in the same server_group and proxeus will merge/deduplicate within it.
    - http_headers:
        X-Scope-OrgID: google-us-dc1
      path_prefix: /prometheus
      scheme: https
      static_configs:
        - targets:
            - mimir.dc1.local:8080
            - mimir.dc2.local:8080
      labels:
        dc: google-us-dc1

    - http_headers:
        X-Scope-OrgID: google-us-dc2
      path_prefix: /prometheus
      scheme: https
      static_configs:
        - targets:
            - mimir.dc1.local:8080
            - mimir.dc2.local:8080
      labels:
        dc: google-us-dc2

    - http_headers:
        X-Scope-OrgID: google-eu-dc1
      path_prefix: /prometheus
      scheme: https
      static_configs:
        - targets:
            - mimir.dc3.local:8080
      labels:
        dc: google-eu-dc1

    - http_headers:
        X-Scope-OrgID: google-eu-dc2
      path_prefix: /prometheus
      scheme: https
      static_configs:
        - targets:
            - mimir.dc3.local:8080
      labels:
        dc: google-eu-dc2

## Example: the tenant of the caller (needs an `auth` block)
##
## Here the backend is one multi-tenant Mimir and every user queries their own
## tenant, so a single server_group covers all of them: the X-Scope-OrgID is
## derived from the authenticated identity, per request. A request that resolves
## to no tenant -- anonymous, or a caller in no mapped group -- falls back to
## `tenant`, and fails when that is unset.
##
## Note this does not apply to `remote_read: true` targets, which keep sending
## the static `tenant`.
#
# proxeus:
#   auth:
#     oidc:
#       issuer_url: https://issuer.example/realms/main
#       client_id: proxeus
#       groups_claim: groups
#
#   server_groups:
#     - backend_type: mimir
#       path_prefix: /prometheus
#       scheme: https
#       static_configs:
#         - targets:
#             - mimir.dc1.local:8080
#       mimir:
#         tenant: team-default
#         tenant_from_identity:
#           source: group
#           map:
#             admins: tenant-a
#             devs: tenant-b
