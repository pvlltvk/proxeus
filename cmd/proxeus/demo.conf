##
## Regular prometheus configuration
##
global:
  evaluation_interval: 60s
  external_labels:
    source: proxeus

# Rule files specifies a list of globs. Rules and alerts are read from
# all matching files.
rule_files:
- "*rule"


##
### Proxeus configuration
##
proxeus:
  server_groups:
    - static_configs:
        - targets:
          - prometheus.demo.prometheus.io:443
      http_client:
        dial_timeout: 1s
        tls_config:
          insecure_skip_verify: true
      scheme: https
      labels:
        replica: a
    - static_configs:
        - targets:
          - prometheus.demo.prometheus.io:443
      http_client:
        dial_timeout: 1s
        tls_config:
          insecure_skip_verify: true
      scheme: https
      labels:
        replica: b
