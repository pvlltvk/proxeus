name: build

on:
  push:
    branches:
      - main
    tags:
      - v*

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: '${{ github.actor }}'
          password: '${{ secrets.GITHUB_TOKEN }}'
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3
      - name: Available platforms
        run: 'echo ${{ steps.buildx.outputs.platforms }}'
      - name: Run Buildx
        run: |
          docker buildx build \
            --platform linux/amd64,linux/386,linux/arm/v7,linux/arm64 \
            --build-arg VERSION="${GITHUB_REF_NAME}" \
            --build-arg REVISION="${GITHUB_SHA}" \
            --build-arg BRANCH="${GITHUB_REF_NAME}" \
            --build-arg BUILD_USER="github-actions" \
            --build-arg BUILD_DATE="$(date -u +%Y%m%d-%T)" \
            --push -t ghcr.io/pvlltvk/proxeus:${GITHUB_REF_NAME//main/latest} .
