<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="260" viewBox="0 0 1100 260"
     role="img" aria-labelledby="proxeus-title">
  <title id="proxeus-title">proxeus</title>

  <style>
    .wordmark { fill: #1E293B; }
    .feed     { stroke: #94A3B8; }
    .trunk    { stroke: #E6522C; }
    .node     { fill: #E6522C; }
    @media (prefers-color-scheme: dark) {
      .wordmark { fill: #F1F5F9; }
      .feed     { stroke: #64748B; }
    }
  </style>

  <!-- Icon: many backends converging into a single endpoint -->
  <g fill="none" stroke-width="14" stroke-linecap="round">
    <path class="feed" d="M60 60 C 150 60, 150 130, 215 130"/>
    <path class="feed" d="M60 130 L 215 130"/>
    <path class="feed" d="M60 200 C 150 200, 150 130, 215 130"/>
    <path class="trunk" stroke-width="18" d="M215 130 L 300 130"/>
  </g>
  <circle class="node" cx="215" cy="130" r="19"/>

  <!-- Wordmark -->
  <text class="wordmark" x="350" y="180"
        font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="150" font-weight="700" letter-spacing="-4">proxeus</text>
</svg>
