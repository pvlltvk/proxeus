replicaCount: 3

hpa:
  enabled: true
  minReplicas: 3
  maxReplicas: 12
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

verticalAutoscaler:
  enabled: true
  updateMode: "Off"
  containerPolicies:
    - containerName: proxeus
      minAllowed:
        cpu: 500m
        memory: 1Gi
      maxAllowed:
        cpu: "4"
        memory: 8Gi
    - containerName: proxeus-server-configmap-reload
      mode: "Off"

podDisruptionBudget:
  enabled: true
  minAvailable: 2

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: proxeus

# A PriorityClass of your own, created outside the chart. Do not reach for
# system-cluster-critical here: the apiserver accepts it outside kube-system
# and it lets proxeus preempt the control plane's own add-ons.
# priorityClassName: proxeus-high

config:
  global:
    evaluation_interval: 5s
  proxeus:
    server_groups:
      - static_configs:
          - targets: ['thanos-query:9090']
      - static_configs:
          - targets: ['vmselect:8481']
