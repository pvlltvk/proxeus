# Backend credentials as files. proxeus does not expand environment variables
# in its config, so per-backend secrets have to arrive on disk and be named by
# the http_client *_file options.
#
# Create the Secrets in the release namespace first:
#   kubectl create secret generic proxeus-thanos-client-tls \
#     --from-file=ca.crt --from-file=tls.crt --from-file=tls.key
#   kubectl create secret generic proxeus-vm-bearer-token --from-file=token
#   kubectl create secret generic proxeus-env --from-literal=HTTPS_PROXY=http://egress-proxy:3128
#
# Authentication for proxeus' own listener is config.proxeus.auth below, not
# webConfig: --web.config.file covers /-/healthy, /-/ready and /metrics as
# well, so it also needs probes.httpHeaders and monitor credentials to match.
extraSecretMounts:
  - name: thanos-client-tls
    secretName: proxeus-thanos-client-tls
    mountPath: /etc/proxeus-secrets/thanos
    defaultMode: 0400
  - name: vm-bearer-token
    secretName: proxeus-vm-bearer-token
    mountPath: /etc/proxeus-secrets/vm

envFrom:
  - secretRef:
      name: proxeus-env

config:
  global:
    evaluation_interval: 5s
  proxeus:
    auth:
      basic:
        # bcrypt hash, as produced by `htpasswd -nBC 10 alice`
        users:
          alice: $2y$10$3kAEbISHvHIFhb8RkNQgu.JbQZfHekIkQbLZDrPQ3bJkYcQ6/T2Xy
    server_groups:
      - static_configs:
          - targets: ['thanos-query:9090']
        http_client:
          tls_config:
            ca_file: /etc/proxeus-secrets/thanos/ca.crt
            cert_file: /etc/proxeus-secrets/thanos/tls.crt
            key_file: /etc/proxeus-secrets/thanos/tls.key
      - static_configs:
          - targets: ['vmselect:8481']
        http_client:
          bearer_token_file: /etc/proxeus-secrets/vm/token
