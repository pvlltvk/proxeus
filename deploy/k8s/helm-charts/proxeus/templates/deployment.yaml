{{- include "chart.validate" . -}}
{{- if .Values.deployment.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "chart.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
    {{- if .Values.extraLabels}}
    {{ toYaml .Values.extraLabels | nindent 4 }}
    {{- end}}
  {{- with .Values.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- if .Values.deployment.strategy }}
  strategy:
    {{- toYaml .Values.deployment.strategy | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "chart.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "chart.selectorLabels" . | nindent 8 }}
        {{- if .Values.extraLabels}}
        {{ toYaml .Values.extraLabels | nindent 8 }}
        {{- end}}
      {{- if or (eq .Values.configMap "") .Values.podAnnotations }}
      annotations:
        {{- if eq .Values.configMap "" }}
        # rolls the pods when the config changes, which is what makes the
        # reloader sidecar optional
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- end }}
        {{- range $key, $value := .Values.podAnnotations }}
        {{ $key }}: {{ $value | quote }}
        {{- end }}
      {{- end }}
    spec:
    {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
    {{- end }}
      serviceAccountName: {{ include "chart.serviceAccountName" . }}
      terminationGracePeriodSeconds: {{ include "chart.terminationGracePeriodSeconds" . }}
    {{- if .Values.priorityClassName }}
      priorityClassName: {{ .Values.priorityClassName }}
    {{- end }}
    {{- if .Values.podSecurityContext }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
    {{- end }}
    {{- if .Values.nodeSelector }}
      nodeSelector:
{{ toYaml .Values.nodeSelector | indent 8 }}
    {{- end }}
    {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
    {{- end }}
    {{- if .Values.affinity }}
      affinity:
{{ toYaml .Values.affinity | indent 8 }}
    {{- end }}
    {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
    {{- end }}
    {{- if or .Values.configCheck.enabled .Values.initContainers }}
      initContainers:
      {{- if .Values.configCheck.enabled }}
      # fail the rollout on a bad config instead of the first query
      - name: config-check
        args:
        - "--config=/etc/proxeus/config.yaml"
        - "--check-config"
        command:
        - "/bin/proxeus"
        image: {{ include "chart.image" . | quote }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        {{- if .Values.securityContext }}
        securityContext:
          {{- toYaml .Values.securityContext | nindent 10 }}
        {{- end }}
        volumeMounts:
        - mountPath: "/etc/proxeus/"
          name: config
          readOnly: true
        resources:
          {{- toYaml .Values.configCheck.resources | nindent 10 }}
      {{- end }}
      {{- with .Values.initContainers }}
        {{- toYaml . | nindent 6 }}
      {{- end }}
    {{- end }}
      containers:
      - args:
        {{- include "chart.args" . | nindent 8 }}
        {{- with .Values.env }}
        env:
{{ toYaml . | indent 10}}
        {{- end }}
        {{- with .Values.envFrom }}
        envFrom:
          {{- toYaml . | nindent 8 }}
        {{- end }}
        command:
        - "/bin/proxeus"
        image: {{ include "chart.image" . | quote }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        name: proxeus
        {{- if .Values.securityContext }}
        securityContext:
          {{- toYaml .Values.securityContext | nindent 10 }}
        {{- end }}
        livenessProbe:
          failureThreshold: 6
          httpGet:
            path: /-/healthy
            port: http
            scheme: HTTP
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 3
        readinessProbe:
          failureThreshold: 120
          httpGet:
            path: /-/ready
            port: http
            scheme: HTTP
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 3
        ports:
        - containerPort: 8082
          name: http
        volumeMounts:
          {{- include "chart.volumeMounts" . | nindent 8 }}
        resources:
          {{- toYaml .Values.resources | nindent 12 }}
      {{- if .Values.configmapReloader.enabled }}
      # container to reload configs on configmap change
      - name: proxeus-server-configmap-reload
        args:
        - "--volume-dir=/etc/proxeus"
        - "--webhook-url=http://localhost:8082/-/reload"
        image: "{{ .Values.configmapReloader.image.repository }}:{{ .Values.configmapReloader.image.tag }}"
        imagePullPolicy: {{ .Values.configmapReloader.image.pullPolicy }}
        {{- if .Values.securityContext }}
        securityContext:
          {{- toYaml .Values.securityContext | nindent 10 }}
        {{- end }}
        volumeMounts:
        - mountPath: "/etc/proxeus/"
          name: config
          readOnly: true
        resources:
          {{- toYaml .Values.configmapReloader.resources | nindent 10 }}
      {{- end }}
      {{- with .Values.extraContainers }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
      volumes:
        {{- include "chart.volumes" . | nindent 6 }}
{{- end }}
