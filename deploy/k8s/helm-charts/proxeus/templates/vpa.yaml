{{- if and .Values.verticalAutoscaler.enabled (.Capabilities.APIVersions.Has "autoscaling.k8s.io/v1") -}}
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  labels:
    {{- include "chart.labels" . | nindent 4 }}
    {{- if .Values.extraLabels}}
    {{ toYaml .Values.extraLabels | nindent 4 }}
    {{- end}}
  name: {{ template "chart.fullname" . }}-vpa
spec:
  targetRef:
    apiVersion: "apps/v1"
    kind: Deployment
    name: {{ template "chart.fullname" . }}
  updatePolicy:
    updateMode: {{ .Values.verticalAutoscaler.updateMode | default "Off" | quote }}
  {{- with .Values.verticalAutoscaler.containerPolicies }}
  resourcePolicy:
    containerPolicies:
      {{- toYaml . | nindent 6 }}
  {{- end }}
{{- end -}} {{/* if .Values.verticalAutoscaler.enabled */}}
