version: '2.0'
services:
  proxeus:
    container_name: proxeus
    image: ghcr.io/pvlltvk/proxeus
    hostname: proxeus
    build:
      context: .
      dockerfile: Dockerfile.proxeus
    ports:
    - "8082:8082"
    volumes:
    - ./../../cmd:/cmd
    - logvolume01:/var/log
    command:
      - --config=/cmd/proxeus/config.yaml
      - --log-level=info
      - --web.enable-lifecycle
    networks:
      - vm_net
  victoriametrics:
    container_name: victoriametrics
    image: victoriametrics/victoria-metrics
    ports:
      - 8428:8428
      - 2003:2003
      - 4242:4242
    volumes:
      - vmdata:/storage
    command:
      - '--storageDataPath=/storage'
      - '--graphiteListenAddr=:2003'
      - '--opentsdbListenAddr=:4242'
      - '--httpListenAddr=:8428'
    networks:
      - vm_net
    restart: always
  alertmanager:
    container_name: alertmanager
    image: prom/alertmanager
    volumes:
      - ./../../cmd:/cmd
      - ./data/alertmanager:/data
    command:
      - '--config.file=/cmd/proxeus/alertmanager.yml'
      - '--storage.path=/data'
    ports:
      - 9093:9093
    networks:
      - vm_net
volumes:
  logvolume01: {}
  vmdata: {}
networks:
  vm_net:
